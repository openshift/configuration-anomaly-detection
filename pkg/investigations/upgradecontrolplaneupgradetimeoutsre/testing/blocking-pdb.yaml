# A single-replica deployment pinned to a master node with minAvailable: 1,
# so the PDB allows zero disruptions and blocks the master node drain.
apiVersion: v1
kind: Namespace
metadata:
  name: cad-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cad-test-blocker
  namespace: cad-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cad-test-blocker
  template:
    metadata:
      labels:
        app: cad-test-blocker
    spec:
      nodeSelector:
        node-role.kubernetes.io/master: ""
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cad-test-blocking-pdb
  namespace: cad-test
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cad-test-blocker
